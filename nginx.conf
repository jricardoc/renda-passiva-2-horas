# Black: o teste A x E x F da captação (ADR-054 do Academia Hub) terminou em 20/10 com a E na frente (23,2% de inscrição
# sobre quem ficou 3 s, contra 20,9% da F e 20,6% da A, 72% de chance de ser a melhor) e não há tempo de chegar aos 95%
# antes da live de 28/10. Quem abre /black recebe sempre a E, inclusive quem tem o cookie black_aef de A ou F e os robôs
# (o anúncio revisado é a mesma página que a pessoa vê). /black-f e a A antiga (/black/index.html) seguem no repositório
# só para consulta. Para um teste novo, volte o split_clients e os maps (git log).
map $cookie_black_aef $black_ab {
    default E;
}
map $black_ab $black_ab_pagina {
    E       /black-e/index.html;
    default /black/index.html;
}
# Sem cookie de sorteio (add_header com valor vazio não manda o cabeçalho)
map $black_ab $black_ae_cookie {
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Cache static assets (1 year)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|avif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Configuração para o site principal no subcaminho
    location /protocolo1/ {
        alias /usr/share/nginx/html/protocolo1/;
        try_files $uri $uri/ /protocolo1/index.html;
    }

    # Página de desconto (destino do backredirect): o mesmo index.html da VSL, fora do Google
    location = /protocolo1/desconto/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /protocolo1/index.html =404;
    }

    # Garante que /protocolo1 (sem barra final) também funcione
    location = /protocolo1 {
        return 301 /protocolo1/$is_args$args;
    }

    # Pagina de links da bio (estatica, sem build)
    # Usa o root do server em vez de alias: o caminho no disco espelha a URI
    # (/usr/share/nginx/html + /links/), entao alias seria redundante e traz o
    # gotcha classico de alias+try_files no fallback.
    location /links/ {
        try_files $uri $uri/ /links/index.html;

        # HTML sempre revalidado para que uma edicao dos links entre no ar na hora.
        # (os assets abaixo de /links/assets/ caem na regex de cache de 1 ano acima)
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Garante que /links (sem barra final) tambem funcione, preservando os parametros.
    # absolute_redirect off => Location relativo ("/links/?..."), entao o browser
    # mantem o https. Sem isso o nginx monta "http://..." (ele so enxerga http
    # atras do proxy que termina o TLS) e o usuario paga um salto extra.
    location = /links {
        absolute_redirect off;
        return 301 /links/$is_args$args;
    }

    # Black Vitalicia: /black (captura) e /black-obrigado, servidas sem barra final e
    # sem redirect (o HTML usa caminhos absolutos). A versao com barra tambem funciona.
    location = /black {
        try_files $black_ab_pagina =404;
        add_header Set-Cookie $black_ae_cookie always;
        add_header Vary "Cookie, User-Agent" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    # /black/ (com barra) também passa pelo sorteio; os arquivos de /black/ seguem pelo prefixo abaixo
    location = /black/ {
        try_files $black_ab_pagina =404;
        add_header Set-Cookie $black_ae_cookie always;
        add_header Vary "Cookie, User-Agent" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location /black/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    # Config gerada com as variaveis do servico: sem o cache de 1 ano da regex de .js
    location = /black/config.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    # Script do teste A/B: sem o cache de 1 ano, para uma correção chegar na próxima visita
    location = /black/ab.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /black-obrigado {
        try_files /black-obrigado/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    # Botão da M1 no WhatsApp (a Meta não aceita link do WhatsApp em botão): segue para o grupo
    location = /grupo {
        try_files /black/grupo.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex" always;
    }
    location /black-obrigado/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    # Variantes C e D da captura (teste A/B/n): mesmas regras da /black-b. Usam o /black/config.js e os arquivos de
    # /black/; so a pagina (e as fotos da C) ficam na pasta de cada uma.
    location = /black-c {
        try_files /black-c/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location /black-c/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    # Variantes E e F da captura (teste A x E x F): mesmas regras da C e da D; usam o /black/config.js e os arquivos de /black/.
    location = /black-e {
        try_files /black-e/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location /black-e/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location = /black-f {
        try_files /black-f/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location /black-f/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location = /black-d {
        try_files /black-d/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location /black-d/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    # Variante B da captura (teste A/B pela URL do anuncio): mesmas regras da /black.
    # Usa o /black/config.js e os arquivos de /black/; so a pagina e as fotos ficam em /black-b/.
    location = /black-b {
        try_files /black-b/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location /black-b/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Black Vitalicia: pagina de vendas do replay da live, a mesma em dois enderecos (o JS dela decide o modo):
    # /replayblack comeca fechada (trafego pago) e /blackreplay e aberta (grupos e automacoes).
    location ~ ^/(replayblack|blackreplay)/?$ {
        try_files /vitalicio/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex" always;
    }
    # /vitalicio/ guarda os arquivos da pagina; o endereco dela sozinho leva a aberta, com os parametros
    location ~ ^/vitalicio(/|/index\.html)?$ {
        absolute_redirect off;
        return 302 /blackreplay/$is_args$args;
    }
    location /vitalicio/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Redireciona a raiz para o subcaminho
    location = / {
        return 301 /protocolo1/;
    }

    # Redireciona a URL antiga (links/anúncios existentes) preservando os parâmetros
    location /renda-passiva-2-horas/ {
        rewrite ^/renda-passiva-2-horas/(.*)$ /protocolo1/$1 permanent;
    }
    location = /renda-passiva-2-horas {
        return 301 /protocolo1/$is_args$args;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}